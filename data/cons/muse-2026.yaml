  - id: 2
    title: "First Page Remix: An Exercise in Flexible Openings"
    date: "2026-08-29"
    day: Saturday
    start: "9:20 AM"
    duration_min: 60
    speakers: ["Kiana Nguyen"]
    location: null
    tags: ["Workshop", "Craft", "Revision"]
    description: "First pages are often the hardest to construct, yet the life of your submission hangs on your execution. Luckily a strong opening for the same book can look a number of ways! For best participation, come with your already written first page and a pen to take notes (other tools welcome, but unnecessary). We will discuss what first pages are meant to do, how to recognize the goal of your scene, and how to revise to best execute that goal."

  - id: 3
    title: "I'm the Bad Guy: How to Write Compelling Villains"
    date: "2026-08-29"
    day: Saturday
    start: "9:20 AM"
    duration_min: 60
    speakers: ["Hannah Capin"]
    location: null
    tags: ["Workshop", "Craft"]
    description: "Villains, monsters, or the darkness within: every story needs a good \"bad guy\"! In this interactive session, we'll break down what makes a compelling antagonist, discuss examples from literature and film, and workshop fragments of our own writing for discussion and feedback. You'll leave with new ideas for developing complex antagonists readers will love to hate (or maybe just love)."

  - id: 4
    title: "Lessons from the Slush Pile"
    date: "2026-08-29"
    day: Saturday
    start: "9:20 AM"
    duration_min: 60
    speakers: ["Linda Lee Landrigan"]
    location: null
    tags: ["Workshop", "Publishing", "Revision"]
    description: "From 20+ years of reading short fiction that comes over the transom, Linda Lee Landrigan will discuss the pitfalls that bedevil many authors. This discussion will give participants tools for self-editing before submitting."

  - id: 5
    title: "The Pitch: How to Sell Your Book in 60 Seconds"
    date: "2026-08-29"
    day: Saturday
    start: "9:20 AM"
    duration_min: 60
    speakers: ["Steven Salpeter"]
    location: null
    tags: ["Workshop", "Publishing", "Pitching"]
    description: "In your pitch sessions and query letters, you have limited time to hook your reader. Come learn professional techniques to pitch your book efficiently."

  - id: 6
    title: "How to Write Sex (In a Literary Way)"
    date: "2026-08-29"
    day: Saturday
    start: "10:30 AM"
    duration_min: 60
    speakers: ["Hannah Capin", "Lydia Netzer"]
    location: null
    tags: ["Workshop", "Craft"]
    description: "Just because you're not writing a spicy romance doesn't mean you can't put sex in your story. But a sex scene shouldn't be a pause in the narrative—it builds conflict, reveals character, and, dare we say, offers a powerful climax. Somewhere between groaning and anatomical euphemisms is a way to make sex integral to the story. In this workshop, authors Hannah Capin and Lydia Netzer will give you tips and guidelines for creating memorable sex scenes in literary novels."

  - id: 7
    title: "Poetry of Place: Mapping the Paths to Where We Are"
    date: "2026-08-29"
    day: Saturday
    start: "10:30 AM"
    duration_min: 60
    speakers: ["Noah Renn"]
    location: null
    tags: ["Workshop", "Poetry"]
    description: "This course will guide writers through exercises designed to explore the marks the locations in our lives leave on us and those we leave on the places we've been. Students will be introduced to concepts such as the accident of birth and environmental psychology and engage in a discourse that seeks to find the difference between what it means to be somewhere and to be from somewhere."

  - id: 8
    title: "Practice your pitch LIVE!"
    date: "2026-08-29"
    day: Saturday
    start: "10:30 AM"
    duration_min: 60
    speakers: ["Carrie Nelson", "Toi Thomas"]
    location: null
    tags: ["Workshop", "Pitching"]
    description: "You wrote your book! Can you pitch it? Come sign up to practice your pitch in our pitch practice room with one of our volunteers or a fellow pitch-prepper, get feedback, make adjustments, and try again."

  - id: 9
    title: "The Publishing Industry: Ask Me Anything"
    date: "2026-08-29"
    day: Saturday
    start: "10:30 AM"
    duration_min: 60
    speakers: ["Daniele Hunter", "Jessica Grace Kelley"]
    location: null
    tags: ["Q&A", "Publishing"]
    description: "During this interactive and moderated Q&A, both a moderator and workshop attendees can ask Daniele questions on a wide variety of publishing-industry topics, including trends in genre and word count, the AI landscape, querying etiquette, the revision process both alone and with an agent, working with a publisher, subsidiary-rights markets, and more. Participants can also ask Daniele about her own list and preferences."


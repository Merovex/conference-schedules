  - id: 33
    title: "Autism and Creative Writing: An Inside Perspective"
    date: "2026-08-30"
    day: Sunday
    start: "1:00 PM"
    duration_min: 60
    speakers: ["Derek Spohn"]
    location: null
    tags: ["Workshop", "Craft"]
    description: "Whether you are on the autism spectrum yourself, have someone on the spectrum in your life, or simply hope to learn more, this workshop is designed to spark thinking and dialogue about how autism and creative writing can overlap. The autistic mind can work very differently than the neurotypical mind in areas such as social skills, special interests, sensory perception, literal thinking, and more."

  - id: 34
    title: "Fantasy & Folklore"
    date: "2026-08-30"
    day: Sunday
    start: "1:00 PM"
    duration_min: 60
    speakers: ["Rebecca Tigner"]
    location: null
    tags: ["Workshop", "Craft"]
    description: "Fantasy continues to be one of the most popular genres in literature. In this session, we'll examine the ways myths, fairy tales, cultural traditions, and folklore have shaped the modern fantasy writing we see today. Participants will explore how to draw inspiration from these historical roots to build rich immersive worlds and characters."

  - id: 35
    title: "The Difference Between Traditional, Hybrid & Self Publishing"
    date: "2026-08-30"
    day: Sunday
    start: "1:00 PM"
    duration_min: 60
    speakers: ["Moni Boyce", "Becky Hilliker", "Steven Salpeter", "Greg Fields"]
    location: null
    tags: ["Panel", "Publishing"]
    description: "There's more than one way to publish a book! But which path is right for you? Join professionals who have experience with traditional, hybrid, and self-publishing, and listen and learn as they break down the differences, benefits, and challenges of each publishing path."

  - id: 36
    title: "The Importance of the First 10 Pages of Your Screenplay"
    date: "2026-08-30"
    day: Sunday
    start: "1:00 PM"
    duration_min: 60
    speakers: ["Diane Fine"]
    location: null
    tags: ["Workshop", "Screenwriting"]
    description: "The first 10 pages of a film or TV script are the most important part of any script you're trying to sell because the readers who evaluate your work—before it will ever be shown to an agent, manager, or producer—will NOT read page 11 if the first 10 don't knock it out of the park! Using film clips, script excerpts, and free-writing exercises, we will explore all the elements necessary to craft a thrilling, memorable, and above all, cinematic story opener."

  - id: 37
    title: "Criminal Investigations for Authors: A Practical Guide to Law Enforcement Operations"
    date: "2026-08-30"
    day: Sunday
    start: "2:10 PM"
    duration_min: 90
    speakers: ["Michael Lovely"]
    location: null
    tags: ["Workshop", "Research"]
    description: "This course is designed to give writers an authentic understanding of how real investigations unfold from the first officer stepping onto a crime scene to the final arguments presented in court. Whether you write crime fiction, thrillers, true crime, or investigative journalism, this course equips you with the operational knowledge needed to portray law enforcement work with accuracy, nuance, and narrative power. Writers will explore the full investigative lifecycle: securing and processing a crime scene, collecting and interpreting evidence, interviewing witnesses and suspects, coordinating with forensic specialists, building investigative timelines, and preparing a case for prosecution. You'll learn how detectives think, how decisions are made under pressure, and how investigative missteps or breakthroughs shape the story."

  - id: 38
    title: "Poetry Prompt Roulette: You'll Never Know What Prompt You'll Get"
    date: "2026-08-30"
    day: Sunday
    start: "2:10 PM"
    duration_min: 90
    speakers: ["Noah Renn"]
    location: null
    tags: ["Write-In", "Poetry"]
    description: "A \"Write Now\" style workshop where students will spin a wheel of over 100 different poetry prompts and begin drafting right then. Don't like the prompt you got? Spin again! Once participants are able to generate a draft, they can share their poem and receive cold-reading-style feedback. The focus is on producing what you can in the time allotted and being open to the creative direction the wheel of prompts sends you toward."

  - id: 39
    title: "Publishing From an Author Perspective"
    date: "2026-08-30"
    day: Sunday
    start: "2:10 PM"
    duration_min: 90
    speakers: ["Lauren Blackwood", "Moni Boyce", "Hannah Capin", "Greg Fields", "Becky Hilliker", "Lydia Netzer", "Jessica Grace Kelley", "Michael Khandelwal"]
    location: null
    tags: ["Panel", "Publishing"]
    description: "There's no single path to publication, and no writer's journey is exactly the same. Join a panel of bestselling, traditionally published, hybrid, and independently published authors for an honest conversation about what it means to build a writing career. Our panelists will share practical advice and the lessons they wish they'd known earlier. Together, they'll offer an inside look at today's publishing industry through the experiences of authors who have found success in different ways, concluding with audience Q&A."

  - id: 40
    title: "What Goes into a Nonfiction Proposal"
    date: "2026-08-30"
    day: Sunday
    start: "2:10 PM"
    duration_min: 90
    speakers: ["Matt Belford"]
    location: null
    tags: ["Workshop", "Publishing", "Nonfiction"]
    description: "There are lots of different guides online as to what goes into a nonfiction proposal. In this session, you'll get firsthand advice from an agent working in the nonfiction space to give you the details you need on what the heck a proposal even is, what sections you need to make sure to include, and which pieces are essential for capturing an agent's attention."

  - id: 41
    title: "Crafting the \"Me\" in Memoir"
    date: "2026-08-30"
    day: Sunday
    start: "3:50 PM"
    duration_min: 60
    speakers: ["Shawn Girvan"]
    location: null
    tags: ["Workshop", "Memoir", "Nonfiction"]
    description: "Your memoir has three versions of you: the Author, the Narrator, and the Character. Point of view is the heart of your voice. Discover how shifting who tells your story changes what readers believe and feel."

  - id: 42
    title: "Creating Characters with Attitude for Film & TV"
    date: "2026-08-30"
    day: Sunday
    start: "3:50 PM"
    duration_min: 60
    speakers: ["Diane Fine"]
    location: null
    tags: ["Workshop", "Screenwriting"]
    description: "What makes a movie or TV character intriguing, compelling, and someone we really want to root for—even if their goals are abhorrent? Using film clips, script excerpts, and free-writing exercises, we will explore the ways that screenwriters craft behavior and attitude to create the most memorable screen characters."

  - id: 43
    title: "Self-Publishing 101: What Every Author Needs to Know Before Uploading a Book"
    date: "2026-08-30"
    day: Sunday
    start: "3:50 PM"
    duration_min: 60
    speakers: ["Moni Boyce"]
    location: null
    tags: ["Workshop", "Publishing"]
    description: "Finishing the manuscript is only one part of publishing a book. Before you hit \"upload,\" there are important decisions to make about editing, covers, formatting, ISBNs, copyright, pricing, distribution, metadata, print options, and more. This beginner-friendly workshop walks authors through the self-publishing process from completed manuscript to published book, explains the professionals and services you may encounter along the way, and highlights common mistakes that can cost new authors time and money. You'll leave with a clearer understanding of what self-publishing actually requires and a roadmap for approaching your first release like a publisher, not just a writer."

  - id: 44
    title: "Write Now"
    date: "2026-08-30"
    day: Sunday
    start: "3:50 PM"
    duration_min: 60

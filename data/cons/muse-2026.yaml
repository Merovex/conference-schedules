  - id: 28
    title: "Building a World on a Small Plot"
    date: "2026-08-30"
    day: Sunday
    start: "10:30 AM"
    duration_min: 60
    speakers: ["Linda Lee Landrigan"]
    location: null
    tags: ["Workshop", "Craft"]
    description: "Short stories must be economical, but they must also exhibit granularity. That may sound paradoxical, but the writer needs to find a way to harmonize the two. Characters don't exist in a vacuum: they emerge from and exist in specific places, and they bear the cultural imprint of those places. A story's action likewise occurs in a specific setting, one that inevitably affects the trajectory of the plot. In this workshop we'll look at how the strategic deployment of detail is an efficient way to convey both the place and the characters' relationship to it. We will pay particular attention to the challenges of the short story, but whether you are working on a story, novel, or memoir, dealing with real or fictional places, this workshop will help you envision that world's multiple facets, understand their influence on characters and story, and vividly convey them to your reader."

  - id: 29
    title: "Creating Characters Readers Care About"
    date: "2026-08-30"
    day: Sunday
    start: "10:30 AM"
    duration_min: 60
    speakers: ["Moni Boyce"]
    location: null
    tags: ["Workshop", "Craft"]
    description: "Readers may come for the plot, but unforgettable characters are what make them stay. In this workshop, we'll break down what makes a character feel compelling, emotionally believable, and worth following for hundreds of pages. We'll explore wants, needs, wounds, flaws, contradictions, relationships, and the internal stakes that give characters depth beyond a list of personality traits. Whether you're writing romance, mystery, fantasy, literary fiction, or something in between, you'll learn practical ways to create characters readers can connect with, even when they don't always like them."

  - id: 30
    title: "Critique Partner Match-up & Club Highlights"
    date: "2026-08-30"
    day: Sunday
    start: "10:30 AM"
    duration_min: 60
    speakers: []
    location: null
    tags: ["Networking"]
    description: "Finding the right critique partner can be hard! We want to make it a little easier. Come join fellow writers, find your table & genre, and talk about what you write and what you're looking for in a critique partner. Maybe you'll find a match, and if you don't, add your name to the critique group form for more ways to find fellow writers!"

  - id: 31
    title: "Tap Dancing on Thin Ice: Creating & Sustaining Dramatic Tension in Poetry"
    date: "2026-08-30"
    day: Sunday
    start: "10:30 AM"
    duration_min: 60
    speakers: ["Tim Seibles"]
    location: null
    tags: ["Workshop", "Poetry"]
    description: "We want to write poems that electrify an audience. Whether they are quietly reading our work or listening to us, we want to create an experience that deeply satisfies all attention paid to our poetry, but how do we do it? Surely, surprise, clarity, and a sharp sense of craft are at the center of this concern, but what exactly do these things mean? In this lab, we will examine poems by established authors and discuss the dramatic elements that make their work memorable."


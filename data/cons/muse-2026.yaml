  - id: 11
    title: "Game Writing"
    date: "2026-08-29"
    day: Saturday
    start: "1:00 PM"
    duration_min: 60
    speakers: ["Rebecca Tigner"]
    location: null
    tags: ["Workshop", "Craft"]
    description: "Dive into the world of storytelling where every choice shapes epic adventures in video games, tabletop RPGs, D&D campaigns, board games, and even card games. Participants will discover the secrets behind crafting compelling narratives, designing captivating characters, and building immersive interactive worlds for players. Whether you dream of creating the next blockbuster video game or crafting intricate quests for tabletop adventures, this session will ignite your creativity and equip you with essential skills to bring your gaming visions to life."

  - id: 12
    title: "Newsletter Content That Readers Actually Want to Open"
    date: "2026-08-29"
    day: Saturday
    start: "1:00 PM"
    duration_min: 60
    speakers: ["Moni Boyce"]
    location: null
    tags: ["Workshop", "Marketing"]
    description: "You know you're supposed to have an email list, but what are you supposed to send once readers join it? This workshop moves beyond the constant \"buy my book\" newsletter and shows authors how to create emails readers actually look forward to opening. We'll explore the types of content that help authors build relationships with their subscribers, keep readers engaged between releases, and naturally turn subscribers into book buyers and loyal fans. You'll leave with practical content ideas, a simple newsletter structure, and a strategy for deciding what to send even when you don't have a new book to promote."

  - id: 13
    title: "The Creative Nonfiction Pendulum: Striking a Universal Chord"
    date: "2026-08-29"
    day: Saturday
    start: "1:00 PM"
    duration_min: 60
    speakers: ["Shawn Girvan"]
    location: null
    tags: ["Workshop", "Memoir", "Nonfiction"]
    description: "The best memoirs balance the deeply personal with the universally resonant. Find your story's universal subject and use research, perspective, and specific details to swing between you and the world. What does your memoir really mean? Connect it to something larger."

  - id: 14
    title: "The Query Letter Blueprint"
    date: "2026-08-29"
    day: Saturday
    start: "1:00 PM"
    duration_min: 60
    speakers: ["Daniele Hunter", "Michael Khandelwal"]
    location: null
    tags: ["Workshop", "Publishing"]
    description: "In this interactive session, literary agent Daniele Hunter will discuss what catches an agent's attention, where a query loses momentum, and how to strengthen the pitch. After a quick overview of query basics, attendees will have the opportunity to share query letters for live, real-time feedback with Daniele, ask questions, and participate in group discussion."

  - id: 15
    title: "Almost Incognito: Writing Through the Mask in Persona Poems"
    date: "2026-08-29"
    day: Saturday
    start: "2:10 PM"
    duration_min: 90
    speakers: ["Tim Seibles"]
    location: null
    tags: ["Workshop", "Poetry"]
    description: "We usually associate character study with fiction or nonfiction, but persona poetry is also driven by the lives of characters—real or imagined. As with all writing, what fuels these poems is the author's interest. Characters are chosen because they connect to the poet's concerns. If I'm writing a poem in the voice of Sojourner Truth or Popeye or Mr. Rogers, I'm working with their words as I sense them, as I imagine myself being them. In this lab, we will examine persona poems and explore how a convincing persona is created. Is the poet directing the character's voice or inhabiting the character—or both?"

  - id: 16
    title: "How to Plan Your Novel in 30 Days"
    date: "2026-08-29"
    day: Saturday
    start: "2:10 PM"
    duration_min: 90
    speakers: ["Lydia Netzer"]
    location: null
    tags: ["Workshop", "Craft"]
    description: "Using the numbers 1-30 and 30 daily prompts, you can start with just your main character's first name and end with a fully developed story idea and road map for your novel. In this workshop, author Lydia Netzer will speedrun you through this unique process and answer all your questions about Novel by Numbers. You'll leave with access to a workbook you can use to plan your own story."

  - id: 17
    title: "The Biggest Mistakes Writers Miss While Revising"
    date: "2026-08-29"
    day: Saturday
    start: "2:10 PM"
    duration_min: 90
    speakers: ["Steven Salpeter"]
    location: null
    tags: ["Workshop", "Revision", "Publishing"]
    description: "Why do manuscripts that are \"almost there\" get rejected by literary agents? Come review the biggest and most common pitfalls writers miss while revising their manuscripts based on interviews with many professional literary agents on why they pass on submissions once they like an concept and get to the manuscript or after they request material from a query."

  - id: 18
    title: "The Mindful Journal: An Expressive Arts Experience for Healing, Reflection, and Renewal"
    date: "2026-08-29"
    day: Saturday
    start: "2:10 PM"
    duration_min: 90
    speakers: ["Lisa Cooper"]
    location: null
    tags: ["Workshop", "Craft"]
    description: "Reconnect with your inner wisdom through a gentle blend of creative writing, low-skill art activities, music and sound exploration, and mindfulness-based stress reduction techniques. No artistic experience needed—just an open heart and a willingness to explore. This session combines the grounding practices of mindfulness with the liberating nature of the expressive arts."

  - id: 19
    title: "Author Branding for Authors Who Hate Branding"
    date: "2026-08-29"
    day: Saturday
    start: "3:50 PM"
    duration_min: 60
    speakers: ["Moni Boyce"]
    location: null
    tags: ["Workshop", "Marketing"]
    description: "If the word \"branding\" makes you think you need to become an influencer, choose three perfect colors, or turn yourself into a product, this workshop is for you. Author branding doesn't have to be complicated. At its core, it's about helping readers quickly understand who you are, what kind of stories you tell, and why your books might be for them. We'll simplify author branding into a few essential pieces, including your voice, values, vibe, ideal reader, and positioning. You'll also learn how to create a recognizable author presence without pretending to be someone you're not."

  - id: 20
    title: "Shut Up & Write"
    date: "2026-08-29"
    day: Saturday
    start: "3:50 PM"
    duration_min: 60
    speakers: ["Carrie Nelson"]
    location: null
    tags: ["Write-In"]
    description: "Participants show up. Each says what they're going to write. Participants write for an hour. Everyone shares how it went! For anyone looking for a little slice of time dedicated to writing, this is a lovely, low-pressure way to show up for your words and make progress. Stay for as little or long as you'd like, and Shut Up and Write!"

  - id: 21
    title: "The Media Rights Landscape: Short Stories and Books Making Your Project Adaptable for Screen"
    date: "2026-08-29"
    day: Saturday
    start: "3:50 PM"
    duration_min: 60
    speakers: ["Steven Salpeter"]
    location: null
    tags: ["Workshop", "Publishing", "Screenwriting"]
    description: "We'll review the book to film/tv landscape, discuss \"high concept writing\" and how to select which projects to focus on if adaptation to screen is your goal."

  - id: 22
    title: "Thrill me: Tension & Voice"
    date: "2026-08-29"
    day: Saturday
    start: "3:50 PM"
    duration_min: 60
    speakers: ["Hannah Capin"]
    location: null
    tags: ["Workshop", "Craft"]
    description: "Crafting a page-turner takes more than a good plot and strong characters: a compelling voice draws readers in from the first line and keeps the story alive long after they've finished the last. This session will be interactive and applied, and we'll examine excerpts that showcase strong voices across genres, experiment with voice in our own work, and share our examples for discussion and feedback. You'll leave with new tools to sharpen and refine your literary voice and strengthen the tension in your writing."


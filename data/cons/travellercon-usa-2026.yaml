  - id: 24
    event_number: 22
    title: "Run Silent Into the Night"
    date: "2026-10-17"
    day: Saturday
    start: "1:30 PM"
    duration_min: 240
    speakers: []
    location: "Pennsylvania Ballroom"
    tags: ["RPG"]
    description: "With rumours of war afoot the Perfidious Angel is making good money transporting Imperial Citizens from the frontier back to Imperial Space. The crew may have stretched their good luck too far. As they finish refueling in a barren system, they discover a damaged Imperial spy ship, just as a Zhodani Fleet begins to arrive in-system. Can the crew evade the Zhodanii Ships and get back to Imperial Space? Or will they be the first casualties of the Fifth Frontier War?"

  - id: 25
    event_number: 23
    title: "System failure."
    date: "2026-10-17"
    day: Saturday
    start: "1:30 PM"
    duration_min: 210
    speakers: []

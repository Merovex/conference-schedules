  - id: 1
    event_number: 39
    title: "DGS Presents: Operation Blacksite Echo"
    date: "2026-10-16"
    day: Friday
    start: "1:30 PM"
    duration_min: 240
    speakers: []
    location: "Ben Franklin Room"
    tags: ["RPG", "DGS"]
    description: "The Fifth Frontier War has come to Efate. The Zhodani are winning. You are a Ministry of Justice special operations fireteam, inserted under cover of darkness into the occupied town of Vel'Hadesh. Three kilometers north, on an isolated ridge, the Zhodani have converted an old monitoring station into something far more dangerous — a black site holding the strategic intelligence files that coordinate their entire theater of operations on Efate. Order of battle. Psionic deployment schedules. The names of every Imperial citizen who sold out their neighbors to the occupation. Your mission is simple. Get in. Download everything. Get out. The extraction window is eight hours. After that, the shuttle leaves without you. Pre-generated characters provided."

  - id: 2
    event_number: 34
    title: "Traveller 1700: The Hidden Prisoner"
    date: "2026-10-16"
    day: Friday
    start: "1:30 PM"
    duration_min: 240
    speakers: []
    location: "Ben Franklin Room"
    tags: ["RPG"]
    description: "A Traveller 1700 Event: The French and Indian War rages, but the deadliest moves are made in silence. At Fort Oswego on Lake Ontario, the British hold a prisoner whose true identity could reshape the war—and beyond. If they uncover it, the balance of power shifts. You are coureurs des bois, traders turned mercenaries. With your Ottawa allies, you must infiltrate the fort, find the prisoner, and extract him before time runs out. Every step risks exposure. Discovery means the noose. No backup. No mercy. No second chances. Pregens Provided"

  - id: 3
    event_number: 29
    title: "Traveller:Encounters: 26-0 Character Creation & Intro"
    date: "2026-10-16"
    day: Friday
    start: "1:30 PM"
    duration_min: 240
    speakers: []
    location: "Ben Franklin Room"
    tags: ["RPG"]
    description: "Life beyond mustering out can be difficult. What do you do with all your newfound time, and all the skills you have developed over the years? Interestingly enough, the answer came to you via invitation: \"Serendipity Corporation is seeking individuals with differing backgrounds and skillsets to fill multiple roles inside its subsidiary companies. You are cordially invited to board the starliner Fractal Trajectory and meet with our hiring teams. Do you have what it takes to be the next Serendipity employee? Come and find out!\" This is an introductory session for players looking to play in the Traveller:Encounters living campaign. Players will work with the referee to generate characters per the Traveller Encounters campaign guide. Immediately following this, the new heroes will find themselves onboard the IMV Fractal Trajectory in an introductory module for the campaign. Seats: 6"

  - id: 4
    event_number: 1
    title: "Friday Evening Panel with: The Emperor (Marc Miller)"
    date: "2026-10-16"
    day: Friday
    start: "6:30 PM"
    duration_min: 60
    speakers: []
    location: "Ballroom C & D"
    tags: ["Panel"]
    description: "We are beyond excited to welcome back Marc Miller to Travellercon/USA. The Emperor will join us, via Zoom, for a 45min panel where he will discuss the Fifth Frontier War and... whatever else he wants. After all... he's the Emperor!"

  - id: 5
    event_number: 46
    title: "DGS Presents: Counting on the Countess"
    date: "2026-10-16"
    day: Friday
    start: "7:30 PM"
    duration_min: 240
    speakers: []
    location: "Ben Franklin Room"
    tags: ["RPG", "DGS"]
    description: "The 5th Frontier war is full on. Things are dicey in the Sword Worlds. Wedged between Zhodani and Imperial space these planets are under the extreme pressure of being caught in the middle. The Imperium hopes to bring Durendal on their side. There is or was a Countess who was somehow capable of ruling – recovering – Durendal. Can you find and help her? Can you help establish an Imperial tie? You have a special team onboard setup to help, but you need to deliver them safely and quietly. Good Luck. {Character Sheets will be provided}"

  - id: 6
    event_number: 41
    title: "DGS Presents: Operation Dark Passage"
    date: "2026-10-16"
    day: Friday
    start: "7:30 PM"
    duration_min: 240
    speakers: []
    location: "Ben Franklin Room"
    tags: ["RPG", "DGS"]
    description: "You made it aboard. The module is secure. Efate is falling away behind the viewport and, for the first time in recent memory, nobody is shooting at you. Then the jump drive fails. Dark Passage is the finale of the Efate Campaign, a locked-room thriller set entirely aboard the free trader Meridian's Promise — 200 tons of aging hull, one pragmatic captain, seventy-three refugees who don't know what they're carrying, and somewhere in the passenger manifest, two Zhodani agents who sabotaged the jump drive before you ever came aboard. The drive can be repaired. It will take time you may not have. The agents need to be found and neutralized quietly, without spooking the refugees, without blowing a cover that has kept the team alive across two planets, and without letting either one transmit your position to the Zhodani intercept corvette that is already turning onto an inbound vector. Pre-generated characters provided."

  - id: 7
    event_number: 32
    title: "DGS Presents: Refugees of the Burning Sector"
    date: "2026-10-16"
    day: Friday
    start: "7:30 PM"
    duration_min: 240
    speakers: []
    location: "Ben Franklin Room"
    tags: ["RPG", "DGS"]
    description: "DGS Presents: Refugees of the Burning Sector - A Classic Traveller Event - You burned everything you had to get your family to the orbital station—your last hope for escape. But when you arrived, the final starliner you paid for passage was already gone. No ships. No answers. No way out. As panic spreads and the thunder of advancing Zhodani forces echoes closer, a desperate offer emerges from an unlikely source: the crew of a luxury pleasure yacht, promising passage out of the doomed sector. Now, you and five other families must place your trust in strangers and make a perilous escape through a collapsing frontier… before it's too late. Pregens Provided"

  - id: 8
    event_number: 51
    title: "Lightning Strike"
    date: "2026-10-16"
    day: Friday
    start: "7:30 PM"
    duration_min: 240
    speakers: []
    location: "Ben Franklin Room"
    tags: ["Miniatures"]
    description: "A damaged Azhanti High Lightning-class cruiser hangs crippled behind the battle lines. Zhodani troops have seized its command decks and begun extracting classified naval intelligence. Now Imperial Marines must fight compartment by compartment to reclaim the ship before the enemy completes its work—or scuttles the cruiser. Command an Imperial Marine assault team or lead the Zhodani defense in a fast-moving miniatures battle through corridors, engineering spaces and command centers. Control vital ship systems, manipulate doors and gravity, and decide the fate of an Imperial capital ship. A four-hour game for 4–6 players. Miniatures and materials provided. No previous Traveller or miniatures experience required."

  - id: 9
    event_number: 18
    title: "Perpetual Traveller: Play | Improve | Repeat"
    date: "2026-10-16"
    day: Friday
    start: "7:30 PM"
    duration_min: 240
    speakers: []
    location: "Pennsylvania Ballroom"
    tags: ["RPG"]
    description: "Perpetual Traveller, a MgT 2e variant that rewards you for inspired gameplay, and allowing you to improve your PCs before and/or after every game, at any table, with any GM who uses the PT rules. No pre-gens provided - come with a PC, or make one at the table."

  - id: 10
    event_number: 10
    title: "That which lurks."
    date: "2026-10-16"
    day: Friday
    start: "7:30 PM"
    duration_min: 210
    speakers: []
    location: "Pennsylvania Ballroom"
    tags: ["RPG"]
    description: "After the Battle of Denotam /Vilis 1413 the Imperial patrol cruiser, Russel Casse, has been assigned patrol duty of one of the system gas giants. A day after the fleet has left for repairs at the starport your ship detects an artificial power source deep in the gas giant clouds. Your ship is ordered to investigate."

  - id: 11
    event_number: 30
    title: "Traveller:Encounters: 26-02 - Blightfall"
    date: "2026-10-16"
    day: Friday
    start: "7:30 PM"
    duration_min: 240
    speakers: []
    location: "Ben Franklin Room"
    tags: ["RPG"]
    description: "A humanitarian relief mission brings your merchant crew into the uneasy grip of the Zhodani-occupied system of Talor, where every cargo manifest is suspect - and every conversation is watched. When tensions spike, inside a heavily controlled orbital station, routine procedures give way to crisis... and survival becomes a matter of timing, trust… and hard vacuum."


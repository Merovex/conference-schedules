  - id: 20
    event_number: 43
    title: "DGS Presents: Operation Last Watch"
    date: "2026-10-17"
    day: Saturday
    start: "1:30 PM"
    duration_min: 240
    speakers: []
    location: "Ben Franklin Room"
    tags: ["RPG", "DGS"]
    description: "Operation: Last Watch picks up the moment the fireteam returns to the safe house — module in hand, cover intact, four hours until the extraction shuttle closes its window. What unfolds is a race across an occupied town with three objectives pulling in different directions at once: find the Zhodani sympathizer who burned your position before they can do it again; protect the civilians of Vel'Hadesh caught in the crossfire of a war they didn't start; and reach the commercial port where a shuttle is preparing its final run to a free trader loading refugees. It will depart with or without you. Pre-generated characters provided."

  - id: 21
    event_number: 21
    title: "DGS Presents: X-Boat Station Theta"
    date: "2026-10-17"
    day: Saturday

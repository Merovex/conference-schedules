    location: "Ben Franklin Room"
    tags: ["RPG", "DGS"]
    description: "DGS Presents: X-Boat Station Theta, a MegaTraveller adventure. You are a Scout team dispatched to X-Boat Station Theta, a remote Imperial X-Boat station that has sat cold and silent for nearly a year after some renovations. As power returns, and the station's systems begin to wake, you'll bring communications back online. But, when a long-silent station starts talking again - you don't always know who's going to answer. Can you bring the station back online - and survive? Characters provided."


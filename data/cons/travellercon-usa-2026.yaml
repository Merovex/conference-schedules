  - id: 29
    event_number: 31
    title: "DGS Presents: Black Ledger: Cargo of Treason"
    date: "2026-10-17"
    day: Saturday
    start: "7:30 PM"
    duration_min: 240
    speakers: []
    location: "Ben Franklin Room"
    tags: ["RPG", "DGS"]
    description: "DGS Presents: Black Ledger: Cargo of Treason - A MegaTraveller Event: The captain died. \"Accident,\" they said. You inherited the ship—and the suspicion that came with it. A year later, you're drowning in fees, stripped of contracts, and quietly blacklisted by House Tukera. Whatever really happened to your captain, they think you're part of it. Now the ship's about to be seized. Then comes the offer: one job, big payout, no questions. The kind of job crews like yours don't walk away from. Pull it off, and you're free. Screw it up… and you vanish like your captain did. Pregens Provided"


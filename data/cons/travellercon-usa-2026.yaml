  - id: 17
    event_number: 38
    title: "The Governor's Gambit: Ghosts of the Fifth Frontier War"
    date: "2026-10-17"
    day: Saturday
    start: "8:00 AM"
    duration_min: 240
    speakers: []
    location: "Pennsylvania Ballroom"
    tags: ["RPG"]
    description: "Officially, you never survived the war. Declared medically unfit for service years ago, your team vanished from Imperial records only to continue serving as one of Imperial Intelligence's most closely guarded assets. Now, after years of deniable operations behind enemy lines, you've been left on a luxury resort world to await your next assignment. An Imperial governor offers more than another mission—he offers your future. A conspiracy involving a powerful corporation, Zhodani intelligence, and a feared island warlord threatens to seize control of a prosperous agricultural world. Before a mercenary army returns with new weapons and dangerous allies, you must infiltrate the fortress of Ironhold, expose the conspiracy, sabotage its defenses, and create the political crisis that will allow Imperial forces to intervene. Stealth. Sabotage. Espionage. Every decision changes the outcome."

  - id: 18
    event_number: 12
    title: "You are Vargr-To the Core!"
    date: "2026-10-17"
    day: Saturday
    start: "8:00 AM"
    duration_min: 180
    speakers: []
    location: "Pennsylvania Ballroom"
    tags: ["RPG"]
    description: "The Fifth Frontier War is underway and you are undercover Vargr Agents infiltrating the Core of the 3rd Imperium! Your Strike Team is after a shadowy Arms dealer who you think is playing both sides of the Vargr/Imperium Front. You have watched a hundred hours of human holovid dramas. These space operas show Humans as bureaucratic, melodramatic sophants who tragically put the interests of the abstract noble run Imperium over personal ties and charismatic leaders. You have stolen, second hand Holomasks and your skewed understanding of their culture. This should be easy...right? (This is inspired by the Signals from the Core podcast and the Singularity Campaign)."


    tags: ["RPG"]
    description: "During a routine evacuation drill in the asteroid belt a shuttle containing forty children in cold sleep malfunctions. Your ship is of course closest and is requested to intercept and attempt rescue."

  - id: 26
    event_number: 35
    title: "Traveller Encounters 26-3: In the Shadow of War"
    date: "2026-10-17"
    day: Saturday
    start: "1:30 PM"
    duration_min: 240
    speakers: []
    location: "Ben Franklin Room"
    tags: ["RPG"]
    description: "The fires of the Fifth Frontier War rage across the Imperium, and every ship, every crew, every contract matters. Amid the chaos, Serendipity and its far-reaching subsidiaries are in constant motion—jumping from crisis to crisis, keeping Imperial logistics alive by grit, ingenuity, and sheer nerve. None more so than USalvage. Their crews dive headlong into the aftermath of battle—twisted hulls, silent distress calls, and drifting graveyards of war. Search-and-rescue, high-risk recovery, and deep-space salvage are all in a day's work… if you survive it. You've been seconded to a USalvage scavenger team on a mission that's as dangerous as it is valuable. Somewhere in a vast, spinning debris field lies the shattered remains of a Zhodani battlecruiser. Broken. Scattered. Unstable. But not empty. Hidden within the wreckage is the ship's data core—packed with high-value tactical intelligence that could shift the balance of the war. The Imperium wants it recovered. Fast."


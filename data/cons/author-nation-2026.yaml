    start: "1:00 PM"
    duration_min: 60
    speakers: ["T.D. Donnelly"]
    location: "Platinum"
    tags: ["Craft", "Live Education"]
    description: "Frequently we hear about the importance of the first page of your story, of the first chapter, of the first act. And yes, of course it's very important to hook your reader so they keep reading, but why do we so rarely focus on the importance of the Killer Ending? A great ending is a force multiplier. It stays in the reader's head, long after the book has been put down. It comes back to a reader, again, and again over time. A great ending is a brainworm that can turn a single read into a lifelong fan. But good endings are HARD. And a truly GREAT ending? That's a literary magic trick. In this hour, we will dive into what makes an ending truly great and lasting in the minds of our readers. We will investigate the importance of both aspects almost all great endings share: Surprise and Inevitability. And we will look at eight great ending forms, in two main varieties: the four Great Twists, and the four Great Payoffs, with plenty of examples of each. And finally we will talk about how we construct a great ending in our stories. (HINT: it involves constructing your story out of order)"

  - id: 39

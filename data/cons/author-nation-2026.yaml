    description: "Most successful author careers are built on series, but many writers publish book one without a long-term strategy. In this practical workshop, million-copy bestselling indie author Sarra Cannon shares a clear framework for designing, writing, and promoting a series that keeps readers coming back. Drawing from experience writing multiple series across her career, she breaks down the different types of series and how to structure story arcs, keep from burning out, and release books in a way that builds readership instead of restarting with every launch. Attendees will leave with a simple roadmap for turning their books into a lasting career."

  - id: 129
    source_id: "recibBH9NeygfZ4vB"
    title: "Pit Crew Panel: Supporting authors without losing your mind"
    date: "2026-11-12"

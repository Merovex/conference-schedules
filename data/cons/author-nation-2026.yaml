    description: "Most authors aren’t failing at marketing because they’re lazy or untalented. They’re failing because they’re trying to do everything themselves. They look at prolific creators with massive platforms and think, “Why can’t I keep up?” That’s like comparing your home coffee maker to Starbucks and wondering why you’re exhausted. In this session, Alex breaks down how successful authors build systems, teams that create consistent visibility without burnout. You’ll learn how to stop relying on willpower and start building a marketing engine that runs week after week. Whether you’re publishing your first book or scaling your brand. This is not a talk about “posting more.” It’s about building leverage. What You’ll Learn (and Walk Away Ready to Implement): 1. The “Systems First” Rule for Author Marketing You’ll learn how to decide what not to commit to—and how to design simple systems before starting blogs, podcasts, newsletters, or social media so consistency becomes automatic instead of exhausting. 2. Exactly What to Delegate (Even If You’ve Never Hired Anyone Before) You’ll leave with a clear list of high-impact tasks authors should never be doing themselves—and how to outsource them for under $10/hour without losing quality or control. 3. A Low-Risk Way to Start Using Virtual Assistants This Week (speaker name) will show you two beginner-friendly VA tasks you can hand off immediately—even if you only have 10–20 minutes of work to delegate. 4. How to Avoid “Random Acts of Marketing” Learn how to turn scattered efforts into a repeatable weekly workflow that compounds over time—so your marketing keeps working even when you’re writing, traveling, or taking a break. 5. A Simple Hiring Framework for VAs, Agencies, and Experts You’ll walk away knowing: * What questions to ask before hiring anyone * How to spot red flags early * When paying more is worth it—and when it’s not Who This Talk Is For: * Authors who feel overwhelmed by marketing * Authors who start strong and burn out * Authors who know visibility matters, but don’t want it to consume their life * Authors ready to trade hustle for systems * Bottom Line: If you’re tired of trying to do everything yourself, and want your book marketing to feel sustainable, focused, and repeatable then this session will give you a clear playbook you can start using immediately. You don’t need to work harder."


    description: "Direct sales have specific strategies that work. In this session, Greg Keogh will break down the tactics behind successful direct sales and use real-world examples to show how authors can build toward a six-figure business. As Co-Founder of Curios, Greg sees firsthand what is working, what is not, and which strategies are selling books every day. He will share the playbook behind successful direct-selling authors, including how to create offers that convert, increase the value of each customer, and grow your customer base by getting other people to promote your books. This session is designed to be practical. You will see real examples, learn which tactics are worth focusing on at different stages of your career, and leave with actionable ideas you can put to work immediately. The goal is to stop relying on luck and start building a repeatable direct sales strategy that can grow with you from your first sale to six figures."

  - id: 128
    source_id: "recioGb9lAg9L0kIk"

    description: "Most authors would rather be writing than posting on social media about their books. This session shows you how simple it can be, and how it doesn't have to distract you from your writing. Skye MacKinnon, a USA Today bestselling romance author with over 100 books, will walk through the system behind her posts turning into sales, built around a few minutes in the evening. She started her own Instagram Reel journey skeptical because almost every success story she'd seen came from KU authors, and she's wide. She posted twice a day for two weeks with almost nothing to show for it. Then one morning she woke up to 75 copies sold overnight of a backlist title that normally sells around five a month, from a post that took her five minutes to make using AuthorScale while watching TV. She'll show exactly what she does, live on screen, from picking a scene to posting it as a trial reel on Instagram, and how to apply the same approach to your own backlist, whether you're in Kindle Unlimited or wide. If you've been meaning to start with social media and have no idea where to begin, come to this one. Same if you're already posting and want to push it further. You'll leave with formats you can copy the same day, without ever filming yourself. Presented by Skye MacKinnon with Marvin Wey from AuthorScale."


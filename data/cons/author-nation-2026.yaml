  - id: 84
    source_id: "recsUtZYRJUcY9wcM"
    title: "Build the System That Fixes It (Part 2 of 2)"
    date: "2026-11-11"
    day: Wednesday
    start: "9:00 AM"
    duration_min: 60
    speakers: ["Jocelyn Lindsay"]
    location: "Palace 4"
    tags: ["Craft"]
    description: "Live workshop. Requires Session 1 prep (Where Your Craft Falls Apart). Every manuscript unravels in the same places. You know this. You've seen it on the last three books you wrote. But you're still revising from scratch every time. No system. No checklist. Just you, the manuscript, and a vague sense of dread. This session fixes that. You'll create a personalized editing checklist. Not generic. Yours. Based on the patterns you identified in Session 1. Three passes: structure first, scenes second, language last. For each pass, you'll write two or three sharp questions that catch YOUR specific weak spots. Do you rush conflict? Your question: \"Does this scene sit in the discomfort long enough?\" Does your dialogue wander? Your question: \"Does every line reveal character or move the plot?\" You'll use a template. You'll build it during the session. This document evolves as you evolve as a writer. Fix one issue now, add questions for the next. You'll use this on every manuscript you write. Then you'll stop revising from scratch."

  - id: 85
    source_id: "recPiCO1NzdkGPR08"
    title: "Stop Buying Sh*t You Don't Need (And Start Building What You Do)"
    date: "2026-11-11"
    day: Wednesday
    start: "10:30 AM"
    duration_min: 60
    speakers: ["Jocelyn Lindsay"]
    location: "Palace 4"
    tags: ["Business & Finance"]
    description: "Live workshop. Bring your laptop/notebook. Courses you didn't finish. Tools you don't use. Ads that didn't work. Services you're not sure you needed. You've spent money. Lots of it. And you're not sure it was worth it. You think you're bad at business. You're not. You just don't know what business ownership looks like yet. And nobody taught you. You're making the same three mistakes every new author business makes: Mistake 1: Spending money to fix symptoms instead of building systems. (You buy ads when you don't have infrastructure. The problem isn't the ads. It's that you're not ready for them.) Mistake 2: Collecting tactics instead of building strategy. (You're trying everything. Nothing sticks. That's because you don't have a plan—just a pile of tactics.) Mistake 3: Saying yes to everything instead of prioritizing ruthlessly. (You think you should be doing all of it. You're paralyzed because you can't. Pick one thing. Do that first.) This session teaches you how to stop. You'll build a Business Decision Filter during the session. One page. Three sections. Questions you ask yourself before you spend money or time. Then you'll test it on a real decision you're facing right now. Should you run ads? Take that course? Hire that service? Write that book? You'll run it through the filter and make an owner decision, not an employee decision (not panic, not what you saw on TikTok). Stop wasting money on shit that doesn't move your business forward."


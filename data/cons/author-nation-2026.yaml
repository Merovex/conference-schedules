  - id: 6
    source_id: "recGmhw9O1UbCILoW"
    title: "How to Reach the Next Generation of Readers — Without Becoming an Influencer"
    date: "2026-11-11"
    day: Wednesday
    start: "9:00 AM"
    duration_min: 60
    speakers: ["Abbie Emmons"]
    location: "Bronze 4"
    tags: ["Advertising and Marketing", "Live Education"]
    description: "Session Description There’s a massive, invisible gap between how many authors market their books and how younger readers actually discover and fall in love with stories today. Platforms like BookTok, Bookstagram, and YouTube aren’t driven by polished marketing—they’re driven by emotional connection, relatability, and peer-to-peer energy. But for many authors, showing up in these spaces feels confusing, time-consuming, or inauthentic. In this session, Abbie breaks down how younger readers actually discover and engage with books across genres like romance, fantasy, sci-fi, and thriller—and where those readers are gathering online. More importantly, she shows how to translate your existing voice into evergreen content that sparks conversation—all without becoming an influencer or chasing trends. Then, she takes it a step further: showing how to turn that attention into a simple, automated sales pipeline. Attendees will learn how to create scroll-stopping content using repeatable post templates, batch and schedule their content in just a few hours per week, and use lightweight automation tools to seamlessly guide readers from social media to their book page. The result? A sustainable, low-effort system that increases visibility, sparks ongoing conversation, and leads to consistent book sales. You don’t need to spend more time on social media—you need a light-touch system that works in the background, so you can focus on what you do best: writing the next book."

  - id: 7
    source_id: "recYq56ibJ5N0QriP"
    title: "Beyond KU: Unlocking Library Distribution for Kindle Unlimited Authors (D2D)"
    date: "2026-11-11"
    day: Wednesday
    start: "9:00 AM"
    duration_min: 60
    speakers: ["Megan Spann"]
    location: "Platinum"
    tags: ["Vendor", "Vendor Session"]
    description: "Libraries are discovery engines. And Amazon’s recent decision to loosen its KDP Select/Kindle Unlimited (KU) exclusivity clause to allow library distribution opens a major new market for KU authors. In this session, you’ll learn about the size of the global library opportunity, you’ll see recent growth statistics, and you’ll come away understanding how different library lending models work. You’ll also gain knowledge of who the major library players are, how to get your books considered for merchandising promotions, and leave with practical tips for getting your books discovered by library readers."

  - id: 8
    source_id: "reccKL6wNzl5CB3AD"
    title: "Black & White Just Became Color: The New, Immersive World of Spoken Multi-Cast™ Audio"
    date: "2026-11-11"
    day: Wednesday
    start: "9:00 AM"
    duration_min: 60
    speakers: []
    location: "Palace 3"
    tags: ["Vendor", "Vendor Session", "All"]
    description: "Audio continues to grow, and listener tastes continue to change. As an indie author, getting your works into audio can be daunting. The cost, workflow and time challenges are real, and traditional narration can often feel flat. But there's a new way to deliver vivid, multi-cast audio of your story. It's not just less expensive and easier to manage. It's what listeners want, as proven by an Edison Research survey of over 1,000 audiobook listeners. \"Black & White Just Became Color!\" Join Spoken founder and CEO Phil Marshall for a look at what today's listeners actually want — and how Spoken Multi-Cast™ makes it possible to produce immersive, character-driven audiobooks quickly and affordably. In a live demo of Spoken Studio, watch a manuscript transformed into a fully-narrated, multi-cast performance in real time, with voices designed around every character. Then hear it straight from the source. Authors of sci-fi, romance, mystery and horror share their experience publishing with Spoken – from manuscript to audiobook — and how they're reaching new readers in a market where quality and immersiveness matter. Bring your questions for a candid, author-to-author conversation about what's working."

  - id: 9
    source_id: "rechPFBvFCcU3GiA4"
    title: "GEO for Authors: A Step-by-Step Framework to Make Your Books Discoverable in AI Search"
    date: "2026-11-11"
    day: Wednesday
    start: "9:00 AM"
    duration_min: 60
    speakers: ["Ricardo Fayet"]
    location: "Gold"
    tags: ["Advertising and Marketing", "Live Education"]
    description: "Understanding AI search is one thing. Making your books visible inside it is another. Drawing from a year-long analysis of 1,000+ structured discovery prompts across ChatGPT, Gemini, Claude, and Amazon Rufus, this session will offer you a practical framework for improving your discoverability AI search. You’ll leave with a clear action plan and an audit checklist you can immediately apply to your catalog."

  - id: 10
    source_id: "recn7BtXPvUkuSViK"
    title: "PublishDrive: Beyond the Big Store: Find More Readers, Keep More Royalties, and Build a Global Author Business"
    date: "2026-11-11"
    day: Wednesday
    start: "9:00 AM"
    duration_min: 60
    speakers: ["Danica Favorite"]
    location: "Bronze 3"
    tags: ["Vendor", "Vendor Session", "Published Voyagers"]
    description: "Your readers aren’t shopping in just one place, and your publishing business shouldn’t depend on a single retailer. In this practical session, discover how PublishDrive helps authors distribute ebooks, audiobooks, and print books to hundreds of stores and thousands of libraries around the world while keeping 100% of their retailer royalties. We’ll explore what “going wide” actually looks like, where authors may be leaving readers and revenue behind, and how the right tools can simplify global distribution, metadata, royalty management, team collaboration, and book promotion. Whether you’re considering expanding beyond Amazon or already publishing wide, you’ll leave with actionable ways to strengthen your distribution strategy and build a more resilient author business."

  - id: 11
    source_id: "recplqQyofoWr8Ecj"
    title: "Writing Bestsellers"
    date: "2026-11-11"
    day: Wednesday
    start: "9:00 AM"
    duration_min: 60
    speakers: ["Eloisa James"]
    location: "Event Center"
    tags: ["Craft", "Live Education", "All"]
    description: "What do twenty-plus New York Times bestsellers and a chart-topping Kindle Vella serial have in common? Not luck. In her famously frank Big Ten, Eloisa James shows how bestsellers are actually built: the story structure and tropes that hook readers, chapter endings that refuse to let go, the mistakes that quietly kill a book in your genre — and then the career side: series strategy, royalties, author platform, marketing. Plus one first-draft page beside its published version, because bestsellers are revised into existence. Traditional, self-publishing, or hybrid: the list isn't a lottery. Learn to play it on purpose."

  - id: 12
    source_id: "recvZihnbAxJcoGeV"
    title: "Platform-Proof Progression for Authors: Building & Growing Your Author Brand In an Era Where Algorithms Are Unreliable"
    date: "2026-11-11"
    day: Wednesday
    start: "9:00 AM"
    duration_min: 60
    speakers: ["Mark Leslie Lefebvre"]
    location: "Bronze 2"
    tags: ["Advertising and Marketing", "Live Education"]
    description: "Every author has experienced algorithm shifts, visibility drops, and getting lost in the digital slush pile. Whether it's Amazon's constantly changing recommendation engine, Facebook's organic reach collapse, or newsletter deliverability challenges, authors who build their careers on rented land remain perpetually vulnerable. This session examines how to cultivate genuine, lasting connections with readers that exist independently of any single platform—without the need to abandon any of those platforms entirely. Drawing upon three decades of work in the book industry and practical experience building reader communities through newsletters, podcasts, and strategic reader magnets, this talk will over a concrete framework for thinking about direct relationships as the foundation of a sustainable long-term author business rather than just another marketing tactic. We'll explore why diversified distribution channels can complement the creation and curation of those direct connections, how to create value exchanges that readers genuinely appreciate and come back for, and the mindset shift required for authors to stop chasing algorithms and start building foundational audiences that will follow you wherever you go."


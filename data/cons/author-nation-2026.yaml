  - id: 111
    source_id: "rec3mBbG0AxVVWAfH"
    title: "From Low-Hanging Fruit To High-Tech Magic: Exploring The Boundaries Of Author Merchandise"
    date: "2026-11-12"
    day: Thursday
    start: "1:00 PM"
    duration_min: 60
    speakers: ["Kay Vincent"]
    location: "Palace 3"
    tags: ["Intellectual Property Beyond the Book", "Published Voyagers"]
    description: "Other sessions have encouraged us to think beyond books in order to give readers experiences, artifacts, and other extensions of our IP. But once you’re convinced by the “why,” the next questions become: “what” and “how”? What can you do to create products or experiences your readers will love? How do you get from page to product? How do you create physical items without warehousing, manufacturing headaches, or large upfront costs? This session answers those questions with practical, low-risk (and cool!) pathways authors can implement immediately. If you’re ready to expand beyond the page to strengthen both reader loyalty and your bottom line, you’ll leave with concrete ideas — and some guided walkthroughs — of how to get started."

  - id: 112
    source_id: "recuHjgoYjBOGdCBI"
    title: "How to Monetize Your Rough Draft Through Social Storytelling"
    date: "2026-11-12"
    day: Thursday
    start: "1:00 PM"
    duration_min: 60
    speakers: ["Emilia Rose"]
    location: "Bronze 4"
    tags: ["Advertising and Marketing", "Live Education"]
    description: "What if your rough draft was enough to build a devoted readership? This session shows authors how writing in episodes—even in rough, imperfect form—can naturally create anticipation, conversation, and emotional investment from readers as the story is being written. Instead of chasing algorithms or producing constant promotional content, attendees will learn how to design stories that invite reader interaction, encourage return behavior, and turn casual readers into raving fans, using narrative structure and release cadence alone. Readers show up for momentum, access, and connection, and this session breaks down how to harness that on purpose."

  - id: 113
    source_id: "recEDTJlVeURkH1nt"
    title: "Stop Dumping, Start Layering: Adding Backstory and Setting Without Killing Momentum"
    date: "2026-11-12"
    day: Thursday
    start: "1:00 PM"
    duration_min: 60
    speakers: []
    location: "Bronze 3"
    tags: ["Craft", "All"]
    description: "Every novelist faces the same challenge: Your readers want action, stakes, and characters they care about—but they also need the backstory, worldbuilding, and context to understand why any of it matters. If you front-load too much information, your reader may never make it to the story. If you drop an extended flashback into the middle of the book, it can bring the action to a halt. So how do you give readers what they need to know without losing them? In this session, you’ll learn two methods for delivering backstory and setting. Top-down delivery uses exposition and telling to get readers up to speed efficiently—and despite what most writing advice says, it’s sometimes the right choice. Bottom-up delivery weaves context into the live scene, revealing your story world through character action and dialogue. The key is knowing when to use which—and that depends on your goals for each scene. You’ll also learn: - How to position exposition around action so your pacing doesn’t stall - How to make exposition do double duty by provoking new story questions or adding style and texture - What you really need to include in your opening chapter—and what you can leave out - How to track where different kinds of exposition appears in your story and scenes We’ll see all of these techniques in action through examples from recent novels that solve the backstory and worldbuilding challenge in very different ways."

  - id: 114
    source_id: "recqqqqJJc3LrzGcz"
    title: "The Taylor Swift Formula: Building a Fandom That Lasts in the Age of AI"
    date: "2026-11-12"
    day: Thursday
    start: "1:00 PM"
    duration_min: 60
    speakers: ["Damon Courtney"]
    location: "Platinum"
    tags: ["Craft", "Solo Presentation", "Published Voyagers"]
    description: "What can indie authors learn from the queen of fandom herself? Join Damon Courtney, creator and CEO of BookFunnel, as he shares how authors can turn casual readers into lifelong fans by building genuine connections, community, and trust - even in an AI-saturated world. You’ll discover why community beats algorithms every time, learn practical strategies for engaging readers authentically, and find out how to prepare your platform for whatever the industry does next."

  - id: 115
    source_id: "reck4IPix8fhQ1fZf"
    title: "The Ultimate Series Bible: Cross-Referencing Consistency at Scale by using LLMs"
    date: "2026-11-12"
    day: Thursday
    start: "1:00 PM"
    duration_min: 60
    speakers: []
    location: "Palace 4"
    tags: ["AI and Automation", "Live Education"]
    description: "Maintaining continuity across a multi-book series is one of the hardest tasks in fiction. Authors historically relied on messy wikis, disparate notes, or expensive human editors to catch that a character's eye color changed between Book 1 and Book 3. Furthermore, most authors believe AI can’t help with this because it will steal their IP, standard chatbots \"hallucinate\" or forget details due to small context windows. In essence authors face two major barriers to using AI effectively: Privacy and Amnesia. First, many authors avoid AI because they fear their intellectual property will be used to train future models. They don't realize that \"Enterprise\" and \"Business\" tiers often offer contractual Zero Data Retention policies. Second, standard AI tools fail at developmental editing because they have small context windows—they \"forget\" Chapter 1 by the time they read Chapter 10. They cannot analyze a narrative arc or consistent character voice across a whole novel. This session solves the \"Amnesia\" problem by teaching authors how to use Large Context Models as a dynamic, queryable Series Bible that never forgets a detail. What will attendees be able to DO after your session? Attendees will spend the first 20 minutes configuring their environment and the remaining time executing prompts. By the end, they will: Establish a Secure \"Zero-Training\" Environment: Configure a Business/Enterprise workspace (e.g., Google Workspace) to ensure data privacy terms are active, preventing their intellectual property from being used to train public models. Build the Dynamic Bible: Ingest full manuscripts from multiple books into a single Large Context Window (1M+ tokens) to perform \"Consistency Audits\" instantly cross-referencing timeline events, character descriptions, and lore across the entire series to find contradictions. Generate High-Fidelity Ad Copy: Leverage the AI's deep understanding of the full text to generate blurbs, hooks, and ad copy that accurately reflect the tone and plot, rather than generic AI marketing fluff. I am a Data Scientist and Biomedical Informatician with over 15 years of experience. In my professional life, I teach clinical staff how to deploy Large Language Models in healthcare workflows where data privacy is a federal requirement. I am also an independent author and have been published professionally in the academic textbook market. I bridge the gap between hard technical compliance and creative writing. I don't just \"prompt\" I will teach authors the enterprise-grade architecture needed to protect their IP while leveraging the most powerful editing tools available."

  - id: 116
    source_id: "rec95NrqA0VlpLnY1"
    title: "What's Actually Wrong With Novels: The 5 Mistakes in 98% of Manuscripts (and How to Fix Them)"
    date: "2026-11-12"
    day: Thursday
    start: "1:00 PM"
    duration_min: 60
    speakers: ["J.H. Bunting Joe Bunting"]
    location: "Bronze 2"
    tags: ["Vendor", "Vendor Session", "All"]
    description: "Twig analyzed hundreds of manuscripts and found 5 issues that showed up in 98% of them. And not only in debuts: writers with 5-10 published books made them too. In this session, Joe Bunting, a Wall Street Journal bestselling writer who has published books with Penguin Random House, HarperCollins and Hachette as well as independently, walks through the 5 problems and shows you how to spot and fix each one in your own draft. You'll learn why 88% of manuscripts sag in the middle, why half of all antagonists are flat, and why the prose you keep polishing is almost never the real problem. Then Joe will run a live demo of Twig and show how it finds these problems in a full manuscript in 30 minutes or less. By the end, you'll know exactly what to fix quickly to publish a better book, get stronger reviews and sell more books."

  - id: 117
    source_id: "reczqtg4ZNR1OfiYV"
    title: "Your AI Marketing Team: When Agents Stop Assisting and Start Executing"
    date: "2026-11-12"
    day: Thursday
    start: "1:00 PM"
    duration_min: 60
    speakers: ["Chelle Honiker"]
    location: "Gold"
    tags: ["AI and Automation", "Live Education"]
    description: "AI agents can run your email campaigns, schedule your social content, adjust your ad spend, and report back on what worked — without you prompting them every step of the way. This session showcases a working agent workflow for your author marketing so you can stop managing every task manually and start making the decisions that actually need your brain. Right now, most authors interact with AI like a really fast assistant: write me a blurb, suggest some hooks, draft this email. You're still the project manager for every marketing task, every day. Agentic AI changes the job description. You define the goal and the guardrails. The agent handles execution across your channels — drafting, scheduling, monitoring, adjusting — and flags you when something needs a human call. This session puts you inside a working system. You'll see agent workflows executing real author marketing tasks across email, social media, and advertising, with performance data from actual campaigns. You'll map your own marketing operations against an agent-readiness framework, identify which workflows to hand off first, and design the approval checkpoints that keep your voice, your brand, and your ad budget protected. You'll leave with a 90-day plan to deploy your first agent workflow — built around your business, your channels, and your comfort level."

  - id: 118
    source_id: "recuhimSWCCGXanpO"
    title: "Building a Sustainable Author Career by Publishing Wide"
    date: "2026-11-12"
    day: Thursday
    start: "2:30 PM"
    duration_min: 60
    speakers: ["Mark Leslie Lefebvre"]
    location: "Bronze 4"
    tags: ["Business & Finance", "Live Education"]
    description: "The question comes up regularly in author communities: Should I be exclusive to Amazon, or should I publish wide? But there’s more to it than that. (Speaker names) will take writers through a fundamental mindset shift: moving from thinking about wide publishing as a checklist of tasks to embracing it as a sustainable career philosophy. Attendees will discover how to diversify their revenue streams across multiple retail platforms, understand how libraries and bookstores actually operate as businesses, and learn how to position their books for discovery across a global marketplace. From the mechanics of direct versus distributor publishing to the Three A's of Library Strategy—Availability, Awareness, and Acquisition—this session moves well beyond theory and into actionable steps that authors can implement immediately. Whether you are considering leaving Kindle Unlimited exclusivity, have recently gone wide and are wondering why the sales haven't materialized yet, or are building a wide publishing strategy from the ground up, this session will equip you with the knowledge and confidence to grow your readership and your income on your own terms."

  - id: 119
    source_id: "recoxTyvTfted7fis"
    title: "Eight Types of Fans Who Can Grow Your Fandom"
    date: "2026-11-12"
    day: Thursday
    start: "2:30 PM"
    duration_min: 60
    speakers: ["Becca Syme"]
    location: "Event Center"
    tags: ["Advertising and Marketing", "All"]
    description: "Growing fandoms can feel like throwing spaghetti at the wall. Add to that, if you're at all introverted, fandom might sound either frightening or confusing, so we often don't take into consideration that if you have an actual fandom, it should grow itself. In this workshop, we'll cover the roles fans play inside a fandom, and how you can run specific experiments to get them more engaged, at the right time in your business growth. Understanding what fans need from you will help you be empowered to take small actions to increase your fan base growth and be more effective in building a sustainable career."

  - id: 120
    source_id: "recEfsLBOK3jZK56s"
    title: "From Idea to The End: The Three-Part System That Helps Writers Actually Finish Their Books"
    date: "2026-11-12"
    day: Thursday
    start: "2:30 PM"
    duration_min: 60
    speakers: []
    location: "Bronze 1 / Learning Lab"
    tags: ["Vendor", "Vendor Session", "Pre-Published Explorers"]
    description: "Many people start writing novels. Far fewer finish them. The difference isn't usually talent, discipline, or inspiration. It's understanding that finishing a book requires three separate skills: developing your craft, building a sustainable writing habit, and managing the mindset challenges that derail nearly every writer. In this practical session, Hayley Milliman introduces a simple framework that explains why writers get stuck and how to keep moving from first draft to final page. You'll leave with concrete strategies you can apply immediately, whether you're starting your first novel or finishing your tenth."

  - id: 121
    source_id: "rec2TXYpoelFYc2Je"
    title: "Inclusive Worldbuilding: Crafting Settings That Act, Not Decorate"
    date: "2026-11-12"
    day: Thursday
    start: "2:30 PM"
    duration_min: 60
    speakers: ["Eliana West"]
    location: "Bronze 3"
    tags: ["Craft", "Live Education"]
    description: "Worldbuilding isn’t just for fantasy writers—and it’s never neutral. In this craft-driven workshop, authors will learn how to transform setting from passive backdrop into an active force that shapes character behavior, emotion, and plot. This session focuses on practical tools for building worlds that reflect identity, power, belonging, and lived experience. Participants will explore how unconscious defaults show up in setting choices, how sensory detail creates emotional pressure, and how place can welcome, resist, or exclude characters in meaningful ways. Designed for working writers, this workshop delivers immediately usable techniques that deepen immersion, strengthen character motivation, and elevate storytelling across genres."

  - id: 122
    source_id: "recKo7qKZ2F5sKosk"
    title: "Planning and Evaluating Series as an IP Asset (Not a Read-Through Rate)"
    date: "2026-11-12"
    day: Thursday
    start: "2:30 PM"
    duration_min: 60
    speakers: ["JN Chaney"]
    location: "Palace 3"
    tags: ["Intellectual Property Beyond the Book", "Live Education"]
    description: "Read-through rate isn't a strategy — it should be an emergent property. By the time you're measuring it, most of the important decisions are driving it are behind you. Here's the secret: 90% of what makes a series work as a lasting IP asset is decided before you write a single word. The narrative arcs, the premise architecture, the hooks. These aren't just storytelling choices the drive behaviour in customers. They're business decisions that determine whether you're building an audience of repeat buyers or starting from scratch with every release. We'll work through how to design series from the ground up for reader loyalty, what premise and arc structures create compounding audience investment over time, and how to evaluate your series as an IP asset. You'll leave with a practical planning framework you can apply to a series you're developing now, and a clear-eyed way to audit what you've already built."

  - id: 123
    source_id: "recFSuab0svfTPdGl"
    title: "The Invisible Launch: AI Workflows That Run Your Release From Preorder to Post-Launch"
    date: "2026-11-12"
    day: Thursday
    start: "2:30 PM"
    duration_min: 60
    speakers: ["Chelle Honiker"]
    location: "Gold"
    tags: ["AI and Automation", "Live Education"]
    description: "A book launch has roughly 147 moving pieces, and something always slips — the email that fires late, the social post you forgot to schedule, the price promotion that didn't trigger, the ARC follow-up that disappeared into launch-week chaos. This session maps the complete launch lifecycle and shows you exactly where AI-powered workflows replace the manual effort that causes those failures. You'll see working automations (not mockups) that trigger email sequences based on reader behavior, generate and schedule launch content across platforms, coordinate ARC team communications, and produce real-time performance dashboards. The workflows are built from actual launches with actual results data, including what underperformed and why. The session is structured around your next release. Bring your timeline, your marketing channels, and your launch plan (even a rough one). You'll leave with a customized launch automation blueprint — every task categorized as \"automate,\" \"AI assists but you approve,\" or \"you and only you\" — with sequences outlined and workflows mapped, ready to build the week you get home."


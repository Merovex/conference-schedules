    description: "We all have email lists of our readers. We’ve all heard about how important they are. But how well are you using this resource? Can you put a book into Amazon’s Top 500 using nothing more than your email list? In an era where advertising costs continually rise and paid promos deliver diminishing returns, your email list can become the most reliable revenue driver in your business — if it’s structured correctly. In this session, a multi-six figure author and former book marketing consultant will break down how to turn subscribers into repeat buyers through strategic campaigns and automated sequences that generate sales every month, not just at launch. Through real case studies (including an example of a single email campaign that pushed a book into the Top 500 with no paid promotion), you’ll learn how to structure emails that readers both look forward to opening and are motivated to act on. We’ll cover key elements every revenue-driving email should include, how to build automation that works year-round, and how to create predictable income from your list, as well as a brief overview of list-building strategies."


  - id: 65
    source_id: "reckRwDDLEZ4dvGvN"
    title: "Beyond the Cliffhanger: Designing Page-Turning Fiction"
    date: "2026-11-12"
    day: Thursday
    start: "10:30 AM"
    duration_min: 60
    speakers: ["Robin Patchen"]
    location: "Bronze 3"
    tags: ["Craft", "Live Education"]
    description: "Every writer wants to provide that \"just one more chapter\" experience for readers. This class will show you how to create addictive fiction—not through constant action or cliffhangers, but by weaving anticipation into your plot structure. In this craft-focused session, you'll discover how to build momentum at the macro level, where page-turning power originates. We'll explore what keeps readers emotionally invested and desperate to know what happens next. We’ll cover the power of unanswered questions and unsolved mysteries, how to craft characters your readers pull for, and how to escalate stakes by making the danger more acute or the consequences more meaningful. We'll examine how to design antagonistic forces powerful enough to make victory feel uncertain. Walk away knowing what makes plots compulsive—and how to apply those principles to any story you write. Whether you're drafting or revising, no matter the genre, this approach will help you build fiction readers can't put down. Robin Patchen is a USA Today bestselling author of 40 books and a former editor with years of experience studying what makes readers turn pages."

  - id: 66

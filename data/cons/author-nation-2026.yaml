  - id: 25
    source_id: "recHfEiEmxt3cplf4"
    title: "Forget Followers: How to Cultivate Super Fans Through Your Newsletter"
    date: "2026-11-11"
    day: Wednesday
    start: "1:00 PM"
    duration_min: 60
    speakers: ["Elaine Canyon"]
    location: "Gold"
    tags: ["Websites, Email & Direct Sales", "Published Voyagers"]
    description: "You know why you need a newsletter: social media is borrowed land, algorithms shift, etc, etc, etc. But no one tells you how to get past the block of what to write in your newsletter, let alone how to turn your newsletter into the most valuable asset in your business. Until now. Because when you treat your newsletter right, it becomes the place where you grow super fans. In this hands-on workshop, Elaine Canyon breaks down how she has made her subscriber list the most important part of her business and maintained a 40% open rate. You'll learn how to think like a super fan so you can write for super fans, what to put in your emails when you don't have book news, how to sell without apology, and how to build the kind of authentic relationships that turn casual subscribers into evangelists for your work. With exercises that will help you apply these lessons to your newsletter immediately, this session will give you the confidence to not just write your newsletter, but to start cultivating super fans. Followers can forget you. Super fans never will."

  - id: 26
    source_id: "recLJpnJxePJDAroU"
    title: "The Invisible Author: Why Readers and AI Can’t Find You and How to Fix It"
    date: "2026-11-11"
    day: Wednesday
    start: "1:00 PM"
    duration_min: 60
    speakers: ["Stuart Grant"]
    location: "Bronze 2"
    tags: ["Websites, Email & Direct Sales", "Live Education"]
    description: "Readers are now using AI to choose what to read next, not just Google or Amazon. They’re asking things like “what should I read next?” and getting instant recommendations. The real question is: can AI find you, and when it does, does it actually understand what you write and who it’s for? The way readers find you is changing. In this new world of search, your author website needs to “talk to” AI in a way that makes it instantly clear what you write, who your books are for, and how to recommend you to the right readers. Because of this shift, your website is more important than ever, but only if it’s structured so both readers and AI can understand it. This session is focused on optimisation: improving what already exists. We’ll also demystify GEO (Generative Engine Optimisation): what it is, why it matters, and how it connects to the author website decisions that influence whether AI recommends you or ignores you. We’ll look at the pages that matter most (Home, About, and Books pages), plus the other places AI checks (retailer listings and author profiles), and diagnose the issues that reduce visibility or cause inaccurate AI recommendations. Attendees will learn what “good” looks like, which signals matter most (structure, internal linking, clarity, consistency, and schema markup), and how to prioritise fixes for the biggest impact first. It’s not just about being found by AI, it’s about knowing where AI looks, what it looks for, and making sure the right information is structured in the right way. Attendees will leave with a prioritised optimisation checklist and an understanding of exactly what they can do now, and why. Ideal for authors who already have a website and want stronger visibility in search and more accurate AI-driven recommendations. This session is one not miss if you want to be found in the future."

  - id: 27
    source_id: "rec4uT23RuGtEJpsE"
    title: "How Many Words for Snow: Does Your World Actually Work?"
    date: "2026-11-11"
    day: Wednesday
    start: "2:30 PM"
    duration_min: 60
    speakers: ["Lauryn Christopher"]
    location: "Bronze 3"
    tags: ["Craft", "Live Education"]
    description: "A world is more than a map; it’s a web of social logic, the sum of its people’s habits, beliefs, and histories. In this session, we’ll explore ways you can apply anthropological \"field notes\" to your worldbuilding to create the hidden structures that support your story’s society. By building a foundation rooted in social logic, you can create cultures that feel authentic and consistent. Turn your worldbuilding from merely drawing static backdrops into creating vibrant, functioning civilizations on worlds that feel like they existed long before the first page was turned."

  - id: 28
    source_id: "recwc8StUfCW7R9ZX"
    title: "What can Bookvault do for me?"

    location: "Gold"
    tags: ["Intellectual Property Beyond the Book", "Live Education"]
    description: "Discoverability is changing fast, and standing out is getting harder. Readers are overwhelmed with choice, AI is influencing recommendations, and “having a website” is no longer enough on its own. Authors need fresh ways to be more memorable, more clickable, and more shareable. This Innovation session explores new tech and modern author-hub ideas authors can use to stand out and create deeper reader engagement, with real-world examples and practical test ideas. We’ll cover animated covers, augmented reality and QR-driven experiences, NFC in print books, smart speaker and voice-friendly content, plus other emerging approaches that are beginning to shape how readers discover and interact with authors. We’ll also go beyond the tech and look at ways to turn an author website into a richer “author hub” that readers actually enjoy spending time in. That includes world-building elements and fan-friendly content such as Spotify playlists, character art, author readings or short interviews, downloadable book club kits, classroom or children’s party ideas, behind-the-scenes extras, and shareable assets that make it easy for readers to talk about your books. To keep it practical, the session includes a live demonstration of how to create an animated cover using a simple, repeatable workflow, plus guidance on where to use it for maximum impact across websites and social. If you want the latest tech and author-hub ideas you can use right away, this is the session. You’ll leave with fresh, modern ways to stand out and turn casual readers into real fans."

  - id: 132
    source_id: "recoJET9fj1rWBPZc"
    title: "Why You Most Likely Won't Be A 7-Figure Author: And Why That's Okay"
    date: "2026-11-12"
    day: Thursday
    start: "4:00 PM"
    duration_min: 60
    speakers: ["Mark Leslie Lefebvre"]
    location: "Bronze 4"
    tags: ["Mindset & Wellness", "Live Education"]
    description: "THIS ONE MIGHT ALSO BE TITLED SOMETHING LESS \"OFFENSIVE\" SUCH AS SOMETHING LIKE: \"The 25-Year Overnight Success: Reframing Author Career Timelines and Definitions of Success\" The stories we celebrate as sudden successes almost universally involve decades of invisible effort—yet the self-publishing industry continues to sell the myth of rapid discovery, and the fact that anyone can do it. After all \"I did it, so can you!\" is such an enticing lie that we all fall prey to. But what are the realistic chances of getting to a six and seven-figure income as an author when it's clear through numerous industry statistics that most books published selling fewer than a few thousand copies and most authors earning no more than between $2,000 to $5,000 annually. Andy Weir spent twenty-five years writing before THE MARTIAN landed him a seven-figure film deal. Hugh Howey wrote and published for years in relative obscurity before WOOL caught fire. This session confronts the uncomfortable mathematics of author careers head-on. Not to discourage, but to liberate. When authors understand what realistic timelines and income expectations actually look like, they can stop measuring themselves against lottery winners and start building sustainable creative lives. We'll examine the data on author earnings—including why six-figure incomes remain statistically rare and seven-figure incomes rarer still—and explore what the authors who do build lasting careers have in common. Spoiler: it's rarely a single breakout book. It's almost always a long accumulation of work, learning, and reader relationships built over years. Whether you're pursuing traditional publishing, self-publishing, or a hybrid path, you're walking through a different door into the same room. Both paths demand the same fundamental qualities: patience, persistence, continuous improvement, and the ability to find meaning in the work itself rather than solely in external validation. This talk offers a realistic framework for thinking about your author career in decades rather than launches—and why that reframe might be the most important mindset shift you ever make."

  - id: 133
    source_id: "recZVwF3IyrZkPzXj"
    title: "YouTube for Authors 301: Publish Once. Multiply Everywhere."
    date: "2026-11-12"
    day: Thursday
    start: "4:00 PM"
    duration_min: 60
    speakers: ["Bradley Charbonneau"]
    location: "Palace 3"
    tags: ["Intellectual Property Beyond the Book", "Live Education"]
    description: "Many authors are creating content—but still feel overworked and underexposed. Growth feels disconnected from effort. This advanced session focuses on leverage. Attendees will see how one 30-minute video can be transformed into dozens of short clips, distributed across platforms, reused as audio, and structured into what I call an exponential content engine. A single creative act can power weeks—or even months—of visibility. Then comes the acceleration. We’ll explore collaboration models where views, clicks, and even revenue are shared across creators, along with lightweight YouTube promotion strategies that amplify high-performing content without complex funnels. Often overlooked by authors, these tools act as quiet multipliers. Real performance data and examples—including insights gathered from author interviews conducted in the months leading up to the conference—will demonstrate measurable benchmarks across genres. The focus is not performance. It’s leverage. Publish less. Multiply more. Remain a writer first. (Speaker name) is the author of 40 books and has built a YouTube platform of over 200,000 subscribers with more than 5,000 videos published, actively testing the systems shared in this session. (2025 attendee: “Best session I attended all week — actionable and specific.”)"


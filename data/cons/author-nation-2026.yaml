  - id: 15
    source_id: "recH48ye1DbuhQpP9"
    title: "The Author Engine: How to Write, Launch, and Scale Like a 7-Figure Publisher"
    date: "2026-11-11"
    day: Wednesday
    start: "10:30 AM"
    duration_min: 60
    speakers: ["Tony Lee / Jack Gatland"]
    location: "Event Center"
    tags: ["Business & Finance", "All"]
    description: "Are you a writer who self-publishes — or a publisher who writes? In this presentation, New York Times #1 Bestseller Tony Lee reveals the system he built after losing everything during the 2020 pandemic — and how it helped him publish over sixty books and earn over $3 million in six years as an indie author. In this author business talk, you’ll learn how to think like a publisher, treat your catalogue like scalable assets, and build a repeatable workflow that allows you to write faster, launch better, and grow your audience without burning out. This is not just a motivational talk — it’s a strategic, actionable roadmap for long-term author business success. Whether you’re starting your first book or managing a growing backlist, The Author Engine is the upgrade your publishing career needs."

  - id: 16
    source_id: "recJARW4obXtZNw47"
    title: "10 Ways to Use AI to Level Up Your Writing Business"
    date: "2026-11-11"
    day: Wednesday
    start: "10:30 AM"
    duration_min: 60
    speakers: ["Misty M. Beller"]
    location: "Bronze 1 / Learning Lab"
    tags: ["AI and Automation", "Live Education"]
    description: "AI is a powerful lever for author business growth—but only when applied ethically and strategically. This session teaches practical, real-world AI workflows authors can use to analyze business performance and marketing data, including ad spend and conversion metrics, to identify what is working, where money is being wasted, and how to scale profitably. Led by a USA Today bestselling author and publisher with deep marketing experience and 13 years in professional project management, the session demonstrates how AI can surface patterns in audience behavior, series read-through, retailer trends, and advertising outcomes. Attendees will learn how to apply AI to accelerate marketing assets (blurbs, emails, ads, retailer pages), generate ideas, and make smarter business decisions—without compromising voice or values."

  - id: 17
    source_id: "recpjk6CFsypfGqqf"
    title: "Power Couples: Perfect Pairs"
    date: "2026-11-11"
    day: Wednesday
    start: "10:30 AM"
    duration_min: 60
    speakers: ["Damon Suede"]
    location: "Platinum"
    tags: ["Craft", "Live Education"]
    description: "Build the perfect duo to dazzle your readers in any genre. Intriguing relationships drive every great story: it takes two to tangle. Bring your fictional folks to the next level with a technique for characterization and dramatization that will strengthen your ideas, your voice, and your projects at any stage. Amp the action, attraction, and interaction between your toothsome twosome with practical, hands-­on strategies for making lovers, foils, and fighters who pop off the page."

  - id: 18
    source_id: "recxRqBGz55V8OFrq"
    title: "Behind the Curtain of the Next Gold Rush"
    date: "2026-11-11"
    day: Wednesday
    start: "9:00 AM"
    duration_min: 60
    speakers: ["Michael Evans"]
    location: "Bronze 1 / Learning Lab"
    tags: ["Vendor", "Solo Presentation", "All"]
    description: "For a century, Hollywood has ruled the world of filmmaking. Publishing used to be the same way (ahem, New York). Until the indies came. We are coming for the studios now. Gatekeepers be bygones. Welcome to the world we call Creatorwood, the platform where you can turn your stories into movies & shows with AI and sell them directly to viewers. It's the beginning of the biggest revolution in storytelling since the dawn of the internet. AI has made it radically more cost effective to make high quality films. Today, I'm going to show you how to go beyond the book to do just that – and give you the inside scoop on how fellow indie authors are turning their movies into real income today. Storytellers Rule the World. Here's how you can rule the entertainment world of tomorrow with us."

  - id: 19
    source_id: "recPoEVuIarcZTRwJ"
    title: "From Zero to Four Figures: Getting a Financial Foothold for Your Self-Published Fiction"
    date: "2026-11-11"
    day: Wednesday
    start: "10:30 AM"
    duration_min: 60
    speakers: ["Paul Austin Ardoin"]
    location: "Bronze 4"
    tags: ["Advertising and Marketing", "Live Education"]
    description: "Getting on the road to financial success as an indie author can be daunting, especially if you don't have much money to invest in marketing. If you've published one or more books but are struggling to get sales, this session can help you develop strategies to build an audience and get your author business off the ground. Increasing your sales requires the right books, mindset, and marketing — many new authors lack one or more of these pillars. USA TODAY Bestselling Author (speaker name) will guide you through the process of identifying the gaps and mistakes that are holding you back. You’ll learn how (and why) to analyze your books to set yourself up for good results, an overview of marketing mindsets, and best practices for inexpensive tools to help you succeed. This isn't about promises of quitting your day job, getting seven-figure sales, or putting a down payment on a yacht—this is real-world advice to get consistent monthly income for people who are struggling to get sales today. These guidelines are repeatable, proven, inexpensive, and attainable—and can help you grow your self-published fiction business."

  - id: 20
    source_id: "recdbtge8KlMKIN1j"
    title: "From Platform-Dependent to Reader-Owned: Optimizing Your Direct Sales Ecosystem for Stability and Scale"
    date: "2026-11-11"
    day: Wednesday
    start: "10:30 AM"
    duration_min: 60
    speakers: ["Rae Davennor"]
    location: "Bronze 2"
    tags: ["Websites, Email & Direct Sales", "Live Education"]
    description: "For many authors, direct sales begin as an experiment—adding Shopify, a newsletter, or TikTok Shop alongside Amazon. But without a cohesive strategy, these tools become fragmented and underperforming. This session focuses on optimizing a direct-to-reader ecosystem so it functions as a stable, scalable revenue foundation rather than a collection of disconnected platforms. Attendees will learn how to define the role of each channel (retailers, website, email, social, serialization platforms), identify bottlenecks in their sales funnel, and prioritize optimizations that increase conversion, reader lifetime value, and revenue consistency. This is not a setup workshop. It’s a systems-level look at how to reduce platform dependency and build a reader-owned business that performs even when algorithms fluctuate."

  - id: 22
    source_id: "recyuWjtC4jALqmrI"
    title: "Steal Like an Artist: Learning from Other Authors’ Novels"
    date: "2026-11-11"
    day: Wednesday
    start: "10:30 AM"
    duration_min: 60
    speakers: ["T.O. Paine"]
    location: "Bronze 3"
    tags: ["Craft", "Live Education"]
    description: "Stephen King wrote, “Sooner or later, everything old is new again.” It’s true. In many ways, every plot, character, and setting has already been written, and this is a wonderful thing. We have so much to learn from other authors. In this presentation, we will explore a specific method for analyzing other authors’ novels and how to use the results to hone our craft. The goal isn’t to copy. It’s to learn and improve."

  - id: 23
    source_id: "rec4NDupeg1u4tsTi"
    title: "Vibe Coding for Your Publishing Business: Build Custom Tools Without Writing Code"
    date: "2026-11-11"
    day: Wednesday
    start: "1:00 PM"
    duration_min: 60
    speakers: ["Ekello Harrid"]
    location: "Bronze 1 / Learning Lab"
    tags: ["AI and Automation", "Live Education"]
    description: "What if you could build the exact tools your author business needs—without learning to code, without hiring developers, and without paying monthly fees to platforms that don't quite fit how you work? This hands-on session introduces vibe coding and immediately puts it into practice. You'll watch the process unfold live as we build a simple author tool from scratch—describing what we want in plain English and letting AI tools like Claude Cowork, Claude Code, or OpenAI Codex build it in real time. When something breaks, the AI reads the logs and fixes it. When we want a new feature, we just ask. You'll see real examples of what authors are building: social media content generators that match your voice, marketing tools that create ad copy and email sequences, book production machines, and business dashboards that replace expensive subscriptions. By the end, you'll have a clear, replicable workflow you can apply to build your own custom tools—becoming your own SaaS instead of paying for someone else's."


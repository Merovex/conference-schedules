  - id: 144
    source_id: "recfRJuDlx6iiMGeR"
    title: "Build an Author Assistant Workshop"
    date: "2026-11-13"
    day: Friday
    start: "9:00 AM"
    duration_min: 180
    speakers: ["Chelle Honiker"]
    location: "Bronze 1 / Learning Lab"
    tags: ["AI and Automation", "Paid Workshop"]
    description: "Your assistant gets up before you do. By the time you're at the desk there's a brief waiting: what sold yesterday, what the ads cost you per page read, and the short list of things nobody else can do — today's thousand words, a yes or no on the blurb it wrote at 2 a.m., forty seconds of b-roll for Thursday. You handle those. It handles the rest of the day, building the launch campaign and cutting your b-roll into TikToks. The newsletter swap with the other cozy-mystery author is already three emails deep and you haven't touched it. You've cloned yourself and taught the clone how your business runs. Then you went back to writing, which is the only part of this you ever wanted to do. In this workshop I’ll take you from running ad hoc automations to a comprehensive system. One that knows how you work and doesn't chat about it — it does what you ask, efficiently and securely. Yours might say the sweet pen name and the spicy one never share an ad account, or that nothing reaches a reader without your yes. We'll write those in the room. They're what let you stop checking behind it. A one-year subscription to Author Automations Social comes with your seat. That's the piece that posts, schedules, and handles reader comments and DMs, so the assistant you build on Friday has somewhere to send the work on Monday. Upgrade to the ads tier and it reports on your ad spend and sales alongside everything else. Required: A laptop you can install software on. A Claude subscription, set up before you arrive. Claude Code installed and verified — I'll send instructions and a short setup video a week out, and I'd genuinely rather you email me than show up stuck. Optional but recommended. Spark Mail, if you want your assistant reading your calendar, your email, and your meeting notes. Everything in the session works without it. Everything works better with it. This is a PAID workshop https://www.authornation.live/Addedworkshops"


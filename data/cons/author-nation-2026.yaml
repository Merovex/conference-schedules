    start: "4:00 PM"
    duration_min: 60
    speakers: ["Simon Patrick"]
    location: "Bronze 1 / Learning Lab"
    tags: ["Vendor", "Vendor Session", "All"]
    description: "You wrote the book. Now it's time to hear it. ElevenLabs v4 voice model is the biggest leap in AI narration yet, with extraordinary emotion and delivery, dialogue that sounds like a real conversation, and characters who whisper, laugh, hesitate, and even break. In this lively, demo-packed session, audiobook producer, and ElevenLabs ambassador, Simon Patrick, shows you how to direct performances that make listeners forget they're hearing AI at all. Using live demonstrations, you'll hear how v4 handles the things that once gave AI narration away: rapid exchanges between characters, emotional turning points, tension, humor, and quiet moments of grief. You'll learn how to direct a performance rather than simply generate one, shaping delivery scene by scene so your audiobook feels as alive as the book in your reader's head. We'll put it all to work inside the dedicated audiobook workflow for authors before following your finished book through to distribution on the major platforms, and specifically ElevenReader, where listeners can discover it and you can start earning. AI audiobook narration has just grown up. Press play on your book, and hear it the way you always imagined."


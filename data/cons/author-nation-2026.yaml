    location: "Event Center"
    tags: ["Craft", "Live Education"]
    description: "How do you keep readers turning pages for ten books instead of two? Every successful series, regardless of genre, creates narrative tension. Thrillers create it through danger. Romance creates it through emotional uncertainty. Fantasy creates it through escalating stakes. Mystery creates it through unanswered questions. Different genres. Same psychological engine. The real challenge isn't creating that tension. It's sustaining it across hundreds of chapters and multiple books. This session explores how a series outline becomes more than a timeline of events. By mapping character arcs, emotional wounds, relationship dynamics, supporting characters, and long-term antagonists, you'll build a flexible roadmap that continually creates fresh questions, deepens reader investment, and gives readers one compelling reason after another to keep turning the page...and buying the next book."

  - id: 53

    description: "Writers are often told that discipline is the solution to every creative block: just write every day, push through, try harder. But for many authors—especially those living with trauma, ADHD, or both—that advice doesn’t just fail. It causes shame, burnout, and a fractured relationship with the page. In this session, author (speaker name) explores why traditional writing advice breaks down for nonlinear brains and trauma-impacted nervous systems. Drawing from lived experience and years of navigating creativity through chaos, she unpacks how trauma and ADHD affect focus, motivation, emotional regulation, and consistency—and why “productivity hacks” alone aren’t enough. Attendees will learn how to: Recognize when resistance is neurological, not a lack of discipline Build flexible writing systems that work with their brain, not against it Create sustainable creative rhythms without re-traumatizing themselves Let go of guilt while still producing meaningful, professional work This session is equal parts validation and strategy—offering authors permission to stop forcing themselves into systems that don’t fit, and tools to build a writing life that can survive real life."


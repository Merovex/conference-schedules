  - id: 29
    source_id: "rec9NbsEIhS6PvXA9"
    title: "10 Strategies to Level Up Facebook Ads (2026 Edition)"
    date: "2026-11-11"
    day: Wednesday
    start: "4:00 PM"
    duration_min: 60
    speakers: ["Misty M. Beller"]
    location: "Platinum"
    tags: ["Advertising and Marketing", "Live Education"]
    description: "Meta advertising has changed—again. This session breaks down 10 proven, up-to-date strategies designed for authors who want profitable ad spend in 2026. Drawing on the instructor’s experience running over $500k/year in profitable ad spend, the session focuses on unique targeting angles, what to measure to confirm ROAS, and how to troubleshoot the three core failure points (high CPC, low CTR, and conversion leaks). Attendees will leave with a simple diagnostic approach they can apply immediately to improve performance and increase profitable spend."

  - id: 30
    source_id: "recpk3eOEMpSjmAhv"
    title: "High-Converting Product Pages for Direct-Selling Authors"
    date: "2026-11-11"
    day: Wednesday
    start: "1:00 PM"
    duration_min: 60
    speakers: ["Jessica Deen Norris"]
    location: "Palace 4"
    tags: ["Websites, Email & Direct Sales", "Live Education"]
    description: "Most author product pages are treated like simple book listings: a cover, a blurb, and a buy button. But your website doesn’t come with Amazon’s built-in traffic or trust, so your pages have to do more work. In this session, you’ll learn how to build high-converting product pages that turn browsers into buyers and increase revenue per reader. Based on real results growing a direct-sales store from zero to six figures in one year—with only three books—you’ll see exactly what changed conversion: - Product photos that sell, not just look pretty - Social proof that builds instant trust - Page structures that increase average order value - Simple tweaks that dramatically improve results You’ll leave with a practical checklist you can apply to your own product pages right away. Whether you’re new to direct sales or already have a store that isn’t converting the way you hoped, this session will show you what actually works."

  - id: 31
    source_id: "recuxHDuxVMr5jkiR"
    title: "Identity Is the Edge: The Science of Becoming a High-Performance Writer"
    date: "2026-11-11"
    day: Wednesday
    start: "1:00 PM"
    duration_min: 60
    speakers: ["Chris Banks"]
    location: "Bronze 4"
    tags: ["Mindset & Wellness"]
    description: "What if the version of you that struggles to write isn’t the only version available? High performers in sport, business, and the arts often use a psychological tool that sounds theatrical but is deeply scientific: the alter ego. From Beyoncé’s Sasha Fierce to elite athletes who “step into character” before competition, identity shifting is one of the most powerful performance tools we have. In this talk, I will explore the neuroscience and psychology behind alter egos—and show writers how to use identity intentionally to overcome self-doubt, perfectionism, procrastination, and fear of judgment. This isn’t about pretending to be someone else. It’s about activating parts of yourself that already exist. If mindset is the biggest obstacle to finishing great work, identity may be the key."

  - id: 32
    source_id: "reckmiVyyzGD1yjr1"
    title: "From Subscriber to Superfan: 3 Ways to Weaponize your Email List for Success"
    date: "2026-11-11"
    day: Wednesday
    start: "2:30 PM"
    duration_min: 60
    speakers: ["Naomi Rawlings"]
    location: "Gold"

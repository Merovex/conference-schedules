    description: "Fiction should be fun. So, why is Candyland technically not a game, and how can knowing that fact fix a saggy middle or a dodgy climax? Join tabletop game designer David Sherrer for a fun, hands-on playtime that unpacks game mechanics to solve story problems and career choices. Armed with a single die and an index card, you'll work in small groups to fix broken game loops, build a living world one rule at a time (then break it), and re-scope your powers for maximum story punch. Come ready to roll dice, experiment with interactive mechanics, and leave with a practical framework for drafting, worldbuilding, and reader engagement. No game design experience required — just bring a pen and a willingness to explore."

